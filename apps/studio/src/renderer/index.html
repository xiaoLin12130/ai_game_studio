<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <title>AI Game Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">AI Game Studio</span>
        <span class="brand-version" id="app-version">v—</span>
      </div>
      <div class="topbar-status">
        <span class="pill" id="status-pill" data-status="UNCHECKED">未检测</span>
      </div>
    </header>

    <main class="content">
      <section class="card" id="dsh-card">
        <div class="card-head">
          <h2>DSH 运行时</h2>
          <button id="recheck" class="button" type="button">重新检测</button>
        </div>

        <p class="headline" id="headline">尚未检测 DSH。</p>

        <dl class="facts">
          <div class="fact"><dt>运行时版本</dt><dd id="fact-dsh-version">—</dd></div>
          <div class="fact"><dt>协议服务</dt><dd id="fact-server">—</dd></div>
          <div class="fact"><dt>最近检测</dt><dd id="fact-checked">—</dd></div>
          <div class="fact"><dt>耗时</dt><dd id="fact-duration">—</dd></div>
          <div class="fact"><dt>运行时退出码</dt><dd id="fact-exit">—</dd></div>
          <div class="fact"><dt>入口来源</dt><dd id="fact-entry">—</dd></div>
        </dl>

        <div class="notice" id="config-notice" hidden></div>

        <details class="diagnostics">
          <summary>诊断信息</summary>
          <pre id="diagnostics">加载中…</pre>
        </details>
      </section>

      <section class="card tasks-card" id="tasks-card">
        <div class="card-head">
          <h2>任务</h2>
          <div class="tasks-head-tools">
            <span class="tasks-count" id="tasks-count">加载中…</span>
            <button id="tasks-refresh" class="button button-ghost button-small" type="button">刷新</button>
          </div>
        </div>

        <div class="tasks-layout">
          <aside class="task-list-pane" aria-label="任务列表">
            <div class="tasks-alert" id="tasks-alert" role="alert" hidden></div>

            <ul class="task-list" id="task-list">
              <li class="task-list-empty">正在加载任务…</li>
            </ul>

            <form class="task-form" id="task-form" autocomplete="off">
              <h3 class="task-form-title">新建任务</h3>

              <label class="field">
                <span class="field-label">标题</span>
                <input
                  class="input"
                  id="task-title"
                  name="title"
                  type="text"
                  maxlength="120"
                  placeholder="例如：检查存档写入是否幂等"
                  required
                />
              </label>

              <label class="field">
                <span class="field-label">目标</span>
                <textarea
                  class="input"
                  id="task-goal"
                  name="goal"
                  rows="3"
                  maxlength="2000"
                  placeholder="描述希望 DSH 完成的事情"
                  required
                ></textarea>
              </label>

              <div class="field field-inline" role="radiogroup" aria-label="隔离类型">
                <span class="field-label">隔离类型</span>
                <label class="radio-pill">
                  <input type="radio" name="isolation" value="readonly" />
                  <span>只读</span>
                </label>
                <label class="radio-pill">
                  <input type="radio" name="isolation" value="writable" checked />
                  <span>写入</span>
                </label>
              </div>

              <div class="task-form-foot">
                <span class="task-form-error" id="task-form-error" role="alert" hidden></span>
                <button class="button" id="task-create" type="submit">创建任务</button>
              </div>
            </form>
          </aside>

          <div class="task-detail-pane">
            <div class="task-detail-body" id="task-detail-body">
              <p class="task-detail-placeholder">正在加载任务…</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <button id="open-logs" class="button button-ghost" type="button">打开日志目录</button>
      <span class="footer-note">DSH 负责 AI 执行，Studio 负责应用与状态管理。</span>
    </footer>

    <script src="./renderer.js"></script>
  </body>
</html>
